<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karoo Crawl</title>
<meta name="description" content="">
<link rel="icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css?v=7">
</head>
<body data-page="partners">

<section class="phero">
  <svg class="topo" data-c-crop="pages.partners" data-draw></svg>
  <div class="vgrid"><i style="left:33.3%"></i><i style="left:66.6%"></i></div>
  <span class="plus" style="left:calc(66.6% - 6px);top:40%"></span>
  <div class="phero__num">PAGE 04 / 04</div>
  <div class="wrap">
    <p class="eyebrow" data-reveal data-c="pages.partners.eyebrow"></p>
    <div class="phero__row mt-s">
      <h1 class="h-xxl" data-lines data-c-lines="pages.partners.title"></h1>
      <p class="lede" data-reveal data-delay=".2" data-c="pages.partners.lede"></p>
    </div>
  </div>
</section>

<section class="dark u-section">
  <div class="vgrid"><i style="left:33.3%"></i><i style="left:66.6%"></i></div>
  <div class="wrap">
    <h2 class="h-xl" style="max-width:16ch" data-lines data-c-lines="pages.partners.whyTitle"></h2>
    <div class="rules mt-l" data-c-tpl="rules" data-c-src="pages.partners.why"></div>
  </div>
</section>

<section class="u-section">
  <div class="wrap">
    <div class="sec-head">
      <h2 class="h-l" data-lines data-c-lines="pages.partners.packagesTitle"></h2>
      <p class="lede" data-reveal data-c="pages.partners.packagesLede"></p>
    </div>
    <div class="tiers" data-c-tpl="tiers" data-c-src="pages.partners.packages"></div>
  </div>
</section>

<section class="u-section" style="padding-top:0">
  <div class="wrap place">
    <div>
      <h2 class="h-xl" data-lines data-c-lines="pages.partners.factsTitle"></h2>
      <dl data-reveal data-c-tpl="facts" data-c-src="pages.partners.facts"></dl>
    </div>
    <img data-reveal src="assets/img/sunrise-crew.jpg" alt="Runners at sunrise" loading="lazy">
  </div>
</section>

<section class="dark u-section" id="enquire">
  <div class="vgrid"><i style="left:33.3%"></i><i style="left:66.6%"></i></div>
  <div class="wrap">
    <h2 class="h-xl" data-lines data-c-lines="pages.partners.enquireTitle"></h2>
    <p class="lede mt-m" style="color:rgba(242,243,238,.75)" data-c="pages.partners.enquireLede"></p>
    <div class="cta__links mt-l"><a class="btn btn--o" data-c-attr="href:pages.partners.enquireUrl"><span data-c="pages.partners.enquireLabel"></span> <span class="arr">→</span></a></div>
  </div>
</section>

<section class="cta" data-c-cta="pages.partners.cta"></section>

<footer class="foot" id="foot"></footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="assets/terrain.js?v=7"></script>
<script src="content/race.js?v=7"></script>
<script src="assets/js/content.js?v=7"></script>
<script src="assets/js/model.js?v=7"></script>
<script src="assets/js/site.js?v=7"></script>
<script src="assets/js/footer.js?v=7"></script>
<script src="assets/js/pages.js?v=7"></script>
</body>
</html>
