<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karoo Crawl</title>
<meta name="description" content="">
<link rel="icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css?v=5">
</head>
<body data-page="tickets">

<section class="phero">
  <svg class="topo" data-c-crop="pages.tickets" data-draw></svg>
  <div class="vgrid"><i style="left:33.3%"></i><i style="left:66.6%"></i></div>
  <div class="phero__num">PAGE 03 / 04</div>
  <div class="sticker" id="bigSticker"><span>2027</span><small>DATE TBC</small></div>
  <div class="wrap">
    <p class="eyebrow" data-reveal data-c="pages.tickets.eyebrow"></p>
    <div class="phero__row mt-s">
      <h1 class="h-xxl" data-lines data-c-lines="pages.tickets.title"></h1>
      <p class="lede" data-reveal data-delay=".2" data-c="pages.tickets.lede"></p>
    </div>
  </div>
</section>

<section class="u-section" style="padding-top:30px">
  <div class="wrap">
    <div class="sec-head">
      <h2 class="h-l" data-lines data-c-lines="pages.tickets.tiersTitle"></h2>
    </div>
    <div class="tiers" data-c-tpl="tiers" data-c-src="pages.tickets.tiers"></div>
  </div>
</section>

<section class="u-section" style="padding-top:0">
  <div class="wrap">
    <p class="eyebrow" data-c="pages.tickets.rulesEyebrow"></p>
    <div class="golden mt-m" data-c-tpl="golden" data-c-src="pages.tickets.rules"></div>
  </div>
</section>

<section class="dark u-section" id="register">
  <div class="vgrid"><i style="left:33.3%"></i><i style="left:66.6%"></i></div>
  <div class="wrap">
    <h2 class="h-xl" data-lines data-c-lines="pages.tickets.registerTitle"></h2>
    <p class="lede mt-m" style="color:rgba(242,243,238,.75)" data-c="pages.tickets.registerLede"></p>
    <div class="cta__links mt-l"><a class="btn btn--o" data-c-attr="href:pages.tickets.registerUrl"><span data-c="pages.tickets.registerLabel"></span> <span class="arr">→</span></a></div>
  </div>
</section>

<section class="cta" data-c-cta="pages.tickets.cta"></section>

<footer class="foot" id="foot"></footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="assets/terrain.js?v=5"></script>
<script src="content/race.js?v=5"></script>
<script src="assets/js/content.js?v=5"></script>
<script src="assets/js/model.js?v=5"></script>
<script src="assets/js/site.js?v=5"></script>
<script src="assets/js/footer.js?v=5"></script>
<script src="assets/js/pages.js?v=5"></script>
</body>
</html>
